name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build again (e.g. v1.2.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The tag and the VERSION file must agree, so the binaries report the released version.
      - name: Check version
        id: version
        run: |
          version="${TAG#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$version" != "$file" ]; then
            echo "::error::Tag $TAG does not match VERSION ($file)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Release notes
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${TAG}." > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  web:
    name: Web interface
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: frontend/dist

  linux:
    name: Linux
    needs: [prepare, web]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: internal/webui/dist

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X github.com/apiservicesac/dooprint/internal/app.Version=$VERSION" \
            -o dist/dooprint ./cmd/dooprint
          ./dist/dooprint -version

      - name: Package
        run: make package-linux VERSION=$VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/dooprint-${{ env.VERSION }}-linux-amd64.tar.gz

  windows:
    name: Windows
    needs: [prepare, web]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: internal/webui/dist

      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 pkg-config

      # libusb is built for Windows and linked statically, so the .exe needs no DLL.
      - name: Build libusb for Windows
        run: |
          curl -sL https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2 | tar -xj
          cd libusb-1.0.27
          ./configure --host=x86_64-w64-mingw32 --prefix=/opt/libusb-win --enable-static --disable-shared
          make -j4 && sudo make install

      - name: Build
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
          PKG_CONFIG_PATH: /opt/libusb-win/lib/pkgconfig
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/apiservicesac/dooprint/internal/app.Version=$VERSION" \
            -o dist/dooprint.exe ./cmd/dooprint

      - name: Installer
        run: make installer VERSION=$VERSION

      - name: Portable executable
        run: cp dist/dooprint.exe dist/dooprint-$VERSION-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/dooprint-${{ env.VERSION }}-windows-amd64-setup.exe
            dist/dooprint-${{ env.VERSION }}-windows-amd64.exe

  release:
    name: GitHub release
    needs: [prepare, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum dooprint-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Dooprint ${{ env.TAG }}
          body_path: dist/notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            dist/dooprint-*
            dist/SHA256SUMS
