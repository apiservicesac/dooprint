name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go format, vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      # The web interface is embedded at build time; a placeholder is enough to compile.
      - name: Web interface placeholder
        run: mkdir -p internal/webui/dist && echo '<!doctype html><title>dooprint</title>' > internal/webui/dist/index.html

      - name: Format
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./internal/...

  web:
    name: Web interface build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  installers:
    name: Installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n packaging/linux/install.sh scripts/release.sh

      - name: Inno Setup script compiles
        run: |
          mkdir -p dist out && chmod 777 out && head -c 1024 /dev/urandom > dist/dooprint.exe
          docker run --rm -v "$PWD":/work:ro -v "$PWD/out":/out -w /work/packaging/windows amake/innosetup \
            /Q /DAppVersion=0.0.0 /DBinary=../../dist/dooprint.exe /O/out dooprint.iss
