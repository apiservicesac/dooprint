name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go vet and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      # The web interface is embedded at build time; a placeholder is enough to compile.
      - name: Web interface placeholder
        run: mkdir -p internal/webui/dist && echo '<!doctype html><title>dooprint</title>' > internal/webui/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./internal/...

  web:
    name: Web interface build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
